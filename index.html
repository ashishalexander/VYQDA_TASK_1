<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monthly Task Tracker</title>
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 90%;
        margin: 0 auto;
        background-color: white;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
      .task-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }
      .task-table td {
        border: 1px solid #ddd;
        padding: 10px;
        height: 20px;
        text-align: center;
      }
      .task-name {
        text-align: left;
        background-color: #f9f9f9;
        width: 300px;
      }
      .month-header {
        background-color: #f2f2f2;
        font-weight: bold;
        text-align: center;
        padding: 12px;
      }
      .editable-cell {
        cursor: text;
        transition: background-color 0.2s;
      }
      .editable-cell:hover {
        background-color: #e6f7ff;
      }
      .editable-cell:focus {
        outline: 2px solid #1890ff;
        background-color: #e6f7ff;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect } = React;
      
      function TaskTracker() {
        const tasks = [
          "Onboarding Call",
          "Google Search Console Access",
          "Google Analytics Access",
          "Website Access",
          "Technical Audit",
          "Anchor Text and Semantic Analysis",
          "Competitor Analysis",
          "Anchor Text / URL Mapping",
          "Google Data Studio Report + Local Reporting Suite",
          "Site Level Optimization",
          "On Page Optimization",
          "Content Creation",
          "Content Publishing",
          "Premium Press Release",
          "Authority Niche Placements",
          "Review Management",
          "Index Links",
          "Video Recap"
        ];
        
        const columnCount = 6;
        
        const [cellValues, setCellValues] = useState(
          Array(tasks.length).fill().map(() => Array(columnCount).fill(""))
        );
        
        const handleCellEdit = (rowIndex, colIndex, value) => {
          const newCellValues = [...cellValues];
          newCellValues[rowIndex][colIndex] = value;
          setCellValues(newCellValues);
          
          prepareDataForAPI();
        };
        
        const prepareDataForAPI = () => {
          const apiData = tasks.map((task, rowIndex) => {
            const rowData = {
              taskName: task
            };
            
            for (let colIndex = 0; colIndex < columnCount; colIndex++) {
              rowData[`column${colIndex}`] = cellValues[rowIndex][colIndex];
            }
            
            return rowData;
          });
          
          console.log("Data ready for API:", apiData);
          
          return apiData;
        };
        
        return (
          <div className="container">
            <table className="task-table">
              <thead>
                <tr>
                  <th className="month-header" colSpan={columnCount + 1}>MONTH 1</th>
                </tr>
              </thead>
              <tbody>
                {tasks.map((task, rowIndex) => (
                  <tr key={rowIndex}>
                    <td className="task-name">{task}</td>
                    {[...Array(columnCount)].map((_, colIndex) => (
                      <td 
                        key={colIndex}
                        className="editable-cell"
                        contentEditable="true"
                        onBlur={(e) => handleCellEdit(rowIndex, colIndex, e.target.textContent)}
                        suppressContentEditableWarning={true}
                      ></td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }
      
      ReactDOM.render(<TaskTracker />, document.getElementById("root"));
    </script>
  </body>
</html>
